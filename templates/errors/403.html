{% extends "base.html" %}
{% block title %}Access Denied - TruckApp{% endblock title %}

{% block extra_css %}
<style>
    .error-container {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: #f59e0b;
        line-height: 1;
        margin-bottom: 1rem;
    }
    .error-icon {
        font-size: 5rem;
        color: #f59e0b;
        margin-bottom: 1.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div>
            <i class="bi bi-shield-lock error-icon"></i>
            <h1 class="error-code">403</h1>
            <h2 class="mb-3">Access Denied</h2>
            <p class="lead text-muted mb-4">
                You don't have permission to access this resource.
            </p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house-door me-2"></i>Go Home
                </a>
                <a href="mailto:info@aliyu.com.ng" class="btn btn-outline-primary">
                    <i class="bi bi-envelope me-2"></i>Contact Support
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
