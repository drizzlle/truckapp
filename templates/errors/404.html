{% extends "base.html" %}
{% block title %}Page Not Found - TruckApp{% endblock title %}

{% block extra_css %}
<style>
    .error-container {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: #1e3a8a;
        line-height: 1;
        margin-bottom: 1rem;
    }
    .error-icon {
        font-size: 5rem;
        color: #1e3a8a;
        margin-bottom: 1.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div>
            <i class="bi bi-signpost-split error-icon"></i>
            <h1 class="error-code">404</h1>
            <h2 class="mb-3">Page Not Found</h2>
            <p class="lead text-muted mb-4">
                Oops! The page you're looking for seems to have taken a different route.
            </p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house-door me-2"></i>Go Home
                </a>
                <a href="mailto:info@aliyu.com.ng" class="btn btn-outline-primary">
                    <i class="bi bi-envelope me-2"></i>Contact Support
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
