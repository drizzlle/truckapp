{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TruckApp - Smart Logistics Platform{% endblock title %}</title>
    <meta name="description" content="TruckApp connects customers with verified drivers for reliable, affordable logistics and delivery services.">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-blue-light: #1e40af;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #2c3e50;
        }
        
        /* Navbar */
        .navbar-custom {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        .navbar-custom .navbar-brand {
            font-size: 1.5rem;
            color: var(--primary-blue);
        }
        
        .navbar-custom .brand-icon {
            font-size: 1.5rem;
            margin-right: 0.25rem;
        }
        
        .navbar-custom .nav-link {
            color: #4b5563;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: color 0.3s;
        }
        
        .navbar-custom .nav-link:hover {
            color: var(--primary-blue);
        }
        
        /* Footer */
        .footer-custom {
            background: #f8f9fa;
            border-top: 1px solid var(--border-color);
        }
        
        .footer-custom h5,
        .footer-custom h6 {
            color: var(--primary-blue);
        }
        
        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
        }
        
        .footer-link:hover {
            color: var(--primary-blue);
        }
        
        .footer-links li {
            margin-bottom: 0.5rem;
        }
        
        /* Main content spacing */
        main {
            min-height: calc(100vh - 400px);
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column h-100">
    {% include 'includes/navbar.html' %}
    
    <main class="flex-shrink-0">
        {% block content %}
        {% endblock content %}
    </main>
    
    {% include 'includes/footer.html' %}
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
