{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TruckApp - Smart Logistics Platform{% endblock title %}</title>
    <meta name="description" content="TruckApp connects customers with verified drivers for reliable, affordable logistics and delivery services.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cpath d='M25 45 L25 65 L15 65 L15 45 Z M70 45 L70 65 L80 65 L80 45 Z M20 35 L60 35 L60 55 L20 55 Z M60 40 L75 40 L75 55 L60 55 Z M22 68 A5 5 0 1 1 22 68.01 M73 68 A5 5 0 1 1 73 68.01' fill='none' stroke='%232d3748' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="alternate icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAA2klEQVR4nO2WQQ6DMAxE3zn0/9+kbJBYIJUqVeqCBfY8aRZIlsZ2PAkhhBBCCCGE+DcAZ4A7wBPg+UUAnAEu1n8BuFp/Arg5/gJws/4M8HD8BeABcLX+DPAA+AJ4tP4E8AB4AXi0/gTwBHgDeLT+BPAG8G79CeAJ4AXg0foTwBvAp/UngDfAt/UngA+AT+tPAB8An9afAD4AfgG8W38C+AL4BfBu/QngC+AXwLv1J4BvgG8A79afAb4BvgG8W3+2/g3gbP3Z+jPAHeDm+IvjhRBCCCGEEJ/lHZVxuRjYs+aAAAAAAElFTkSuQmCC">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23ffffff'/%3E%3Cpath d='M45 81 L45 117 L27 117 L27 81 Z M126 81 L126 117 L144 117 L144 81 Z M36 63 L108 63 L108 99 L36 99 Z M108 72 L135 72 L135 99 L108 99 Z M39.6 122.4 A9 9 0 1 1 39.6 122.41 M131.4 122.4 A9 9 0 1 1 131.4 122.41' fill='none' stroke='%232d3748' stroke-width='5.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-blue-light: #1e40af;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #2c3e50;
        }
        
        /* Navbar */
        .navbar-custom {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        .navbar-custom .navbar-brand {
            font-size: 1.5rem;
            color: var(--primary-blue);
        }
        
        .navbar-custom .brand-icon {
            font-size: 1.5rem;
            margin-right: 0.25rem;
        }
        
        .navbar-custom .nav-link {
            color: #4b5563;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: color 0.3s;
        }
        
        .navbar-custom .nav-link:hover {
            color: var(--primary-blue);
        }
        
        /* Footer */
        .footer-custom {
            background: #f8f9fa;
            border-top: 1px solid var(--border-color);
        }
        
        .footer-custom h5,
        .footer-custom h6 {
            color: var(--primary-blue);
        }
        
        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
        }
        
        .footer-link:hover {
            color: var(--primary-blue);
        }
        
        .footer-links li {
            margin-bottom: 0.5rem;
        }
        
        /* Main content spacing */
        main {
            min-height: calc(100vh - 400px);
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column h-100">
    {% include 'includes/navbar.html' %}
    
    <main class="flex-shrink-0">
        {% block content %}
        {% endblock content %}
    </main>
    
    {% include 'includes/footer.html' %}
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
